set -g default-shell /bin/zsh

# mouse
#set -g mode-mouse on
#set -g mouse-select-pane on

#set -g mouse-utf8 on
set -g mouse on
set -s set-clipboard on
set -g -s set-clipboard on

# https://github.com/ojroques/vim-oscyank/issues/26#issuecomment-1179722561
set -g -s allow-passthrough on
# bind -n WheelUpPane   select-pane -t= \; copy-mode -e \; send-keys -M
# bind -n WheelDownPane select-pane -t= \;                 send-keys -M

bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# Ring the bell if any background window rang a bell
set -g bell-action none

# Default termtype. If the rcfile sets $TERM, that overrides this value.
# set -g default-terminal screen-256color
# set-option -ga terminal-overrides ",xterm-254color:Tc"
# set -g default-terminal "xterm-256color"
# set -as terminal-features ',xterm-256color:clipboard'

# set -g default-terminal "xterm-256color"
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color*:Tc"

# set -s extended-keys on
# set -as terminal-features 'xterm*:extkeys'

# set -g default-terminal "xterm-24bit"
# set -g terminal-overrides ',xterm-24bit:Tc'


# set -g default-terminal "tmux-256color"
# set -ag terminal-overrides ",xterm-256color:RGB"


# Keep your finger on ctrl, or don't
bind-key ^D detach-client

# Create splits and vertical splits
bind-key v split-window -h -l 50% -c "#{pane_current_path}"
bind-key ^V split-window -h -l 50% -c "#{pane_current_path}"
bind-key s split-window -v -l 50% -c "#{pane_current_path}"
bind-key ^S split-window -v -l 50% -c "#{pane_current_path}"


bind-key V select-layout even-vertical
bind-key B select-layout even-horizontal

# Pane resize in all four directions using vi bindings.
# Can use these raw but I map them to shift-ctrl-<h,j,k,l> in iTerm.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
# is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
#     | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
# bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
# bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
# bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
# bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
#
# tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
# if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
#     "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
# if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
#     "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

# Smart pane switching with awareness of vim splits
# bind -n C-k run-shell '~/bin/tmux-vim-select-pane -U'
# bind -n C-j run-shell '~/bin/tmux-vim-select-pane -D'
# bind -n C-h run-shell '~/bin/tmux-vim-select-pane -L'
# bind -n C-l run-shell '~/bin/tmux-vim-select-pane -R'
# bind -n "C-\\" run-shell '~/bin/tmux-vim-select-pane -l'

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n C-h   if-shell  "$is_vim"  "send-keys C-h"    "select-pane -L"
bind-key -n C-j   if-shell  "$is_vim"  "send-keys C-j"    "select-pane -D"
bind-key -n C-k   if-shell  "$is_vim"  "send-keys C-k"    "select-pane -U"
bind-key -n C-l   if-shell  "$is_vim"  "send-keys C-l"    "select-pane -R"
bind-key -n 'C-\' if-shell  "$is_vim"  "send-keys C-\\\\" "select-pane -l"


bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Use vi keybindings for tmux commandline input.
# Note that to get command mode you need to hit ESC twice...
set -g status-keys vi

# Use vi keybindings in copy and choice modes
setw -g mode-keys vi

# easily toggle synchronization (mnemonic: e is for echo)
# sends input to all panes in a given window.
bind e setw synchronize-panes on
bind E setw synchronize-panes off

# set first window to index 1 (not 0) to map more to the keyboard layout...
set-option -g base-index 0
set-window-option -g pane-base-index 1
set-window-option -g mouse on
set -g renumber-window on

# color scheme (styled as vim-powerline)
set -g status-position bottom
set -g status on

# Patch for OS X pbpaste and pbcopy under tmux.
# set-option -g default-command "which reattach-to-user-namespace > /dev/null && reattach-to-user-namespace -l $SHELL || $SHELL"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Screen like binding
unbind C-b
set -g prefix C-a
bind a send-prefix

# No escape time for vi mode
set -sg escape-time 0

# Screen like binding for last window
unbind l
bind '6' last-window
bind '\' switch-client -l


bind Q killw

# Bigger history
set -g history-limit 10000

# New windows/pane in $PWD
bind c new-window -c "#{pane_current_path}"

unbind S
bind S display-popup -E "read \"?Session name: \" TMUX_SESSION_NAME && pause ; \
                          tmux new-session -d -s \"\$TMUX_SESSION_NAME\" -c \"#{pane_current_path}\" && \
                          tmux switch-client -t \"\$TMUX_SESSION_NAME\""

unbind t
bind t display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "tig"

# Fix key bindings broken in tmux 2.1
# set -g assume-paste-time 0

# force a reload of the config file
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Local config
if-shell "[ -f ~/.tmux.conf.user ]" 'source ~/.tmux.conf.user'

unbind w
bind w display-popup -E "tmux list-windows -a -F '#{window_activity} #{session_name}:#{window_index} - #{window_name} - #{pane_current_path}' \
                          | sort -r \
                          | grep -v \"^$(tmux display-message -p '#S')\$\" \
                          | fzf +s --reverse --cycle --with-nth 2.. \
                          | awk '{print $2}' \
                          | xargs -r tmux switch-client -t"

# List of plugins
set -g @plugin 'christoomey/vim-tmux-navigator'

# --> Catppuccin (Mocha)
